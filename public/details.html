<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>وردەکاری | Kurd Cine</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="navbar">

  <a href="/" class="logo">
    KURD<span>CINE</span>
  </a>

  <nav>
    <a href="/">سەرەکی</a>
    <a href="/movies.html">فیلمەکان</a>
    <a href="/series.html">زنجیرەکان</a>
    <a href="/admin.html">بەڕێوەبردن</a>
  </nav>

</header>


<main>

  <section class="section">

    <div id="details">
      <p>چاوەڕێ بکە...</p>
    </div>

  </section>

</main>


<footer>
  <p>© Kurd Cine</p>
</footer>


<script>

const params =
  new URLSearchParams(window.location.search);

const id = params.get("id");


async function loadDetails() {

  const element =
    document.getElementById("details");


  if (!id) {

    element.innerHTML = `
      <div class="empty">
        <p>ناونیشانی ناوەڕۆک نەدۆزرایەوە.</p>
      </div>
    `;

    return;
  }


  try {

    const response =
      await fetch(
        "/api/titles/" +
        encodeURIComponent(id)
      );


    if (!response.ok) {
      throw new Error("Title not found");
    }


    const title =
      await response.json();


    const poster =
      title.poster ||
      "https://placehold.co/500x750/111522/ffffff?text=Kurd+Cine";


    element.innerHTML = `

      <div class="detail">

        <img
          class="detail-poster"
          src="${escapeHTML(title.poster || poster)}"
          alt="${escapeHTML(title.title)}"
          onerror="this.src='https://placehold.co/500x750/111522/ffffff?text=Kurd+Cine'"
        >


        <div class="detail-info">

          <h1>
            ${escapeHTML(title.title)}
          </h1>


          <div class="card-meta">

            ${escapeHTML(title.year || "")}

            ${
              title.genre
                ? " • " +
                  escapeHTML(title.genre)
                : ""
            }

          </div>


          ${
            title.description
              ? `
                <p>
                  ${escapeHTML(title.description)}
                </p>
              `
              : ""
          }


          ${
            title.type === "movie" &&
            title.video_url
              ? `
                <a
                  class="btn"
                  href="${escapeHTML(title.video_url)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ▶️ بینینی فیلم
                </a>
              `
              : ""
          }

        </div>

      </div>


      ${
        title.type === "series"
          ? renderSeasons(title.seasons || [])
          : ""
      }

    `;

  } catch (error) {

    console.error(error);

    element.innerHTML = `
      <div class="empty">
        <p>
          کێشەیەک ڕوویدا لە بارکردنی زانیاری.
        </p>
      </div>
    `;

  }

}


function renderSeasons(seasons) {

  if (!seasons.length) {

    return `
      <div class="section">

        <h2>
          ئەڵقەکان
        </h2>

        <p>
          هێشتا هیچ وەرز و ئەڵقەیەک زیاد نەکراوە.
        </p>

      </div>
    `;

  }


  return seasons.map(season => {

    const episodes =
      season.episodes || [];


    return `

      <div class="section">

        <div class="section-title">

          <h2>
            وەرزی ${escapeHTML(
              season.seasonNumber
            )}
          </h2>

        </div>


        <div class="movie-grid">

          ${
            episodes.length
              ? episodes.map(episode => `

                  <div class="card">

                    <div class="card-content">

                      <div class="card-title">
                        ئەڵقە
                        ${escapeHTML(
                          episode.episodeNumber
                        )}
                        ${
                          episode.title
                            ? " - " +
                              escapeHTML(
                                episode.title
                              )
                            : ""
                        }
                      </div>


                      ${
                        episode.description
                          ? `
                            <div class="card-meta">
                              ${escapeHTML(
                                episode.description
                              )}
                            </div>
                          `
                          : ""
                      }


                      ${
                        episode.video_url
                          ? `
                            <a
                              class="btn"
                              href="${escapeHTML(
                                episode.video_url
                              )}"
                              target="_blank"
                              rel="noopener noreferrer"
                            >
                              ▶️ بینینی ئەڵقە
                            </a>
                          `
                          : `
                            <div class="card-meta">
                              لینکێکی بینین نییە.
                            </div>
                          `
                      }

                    </div>

                  </div>

                `).join("")
              : `
                <p>
                  هیچ ئەڵقەیەک نییە.
                </p>
              `
          }

        </div>

      </div>

    `;

  }).join("");

}


function escapeHTML(value) {

  return String(value || "").replace(
    /[&<>"']/g,
    character => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    })[character]
  );

}


loadDetails();

</script>

</body>

</html>
